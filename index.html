<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>APEX/RACING</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;
background:linear-gradient(180deg,#4f9bff 0%,#9fc4ff 38%,#e4b8ff 62%,#ff9ecb 100%);touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(40,25,90,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:14px}
:root{--f:clamp(9px,2.5vh,15px)}
body{font-size:var(--f)}
#top{position:fixed;top:2vh;left:2vw;right:2vw;display:flex;justify-content:space-between;align-items:center;z-index:5}
#top h1{font-size:calc(var(--f)*1.5);font-style:italic;font-weight:600;text-shadow:0 2px 8px #0006}
.cur{display:flex;gap:1.2vw}
.cur div{padding:.4em .9em;border-radius:99px}
#left{position:fixed;left:1.5vw;top:12vh;width:21vw;z-index:5;padding:1vh}
#av{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vh}
.a{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--f)*2);
background:linear-gradient(135deg,#6a4cc9,#2c1f66);border:2px solid transparent;position:relative}
.a.on{border-color:#7fe3ff;box-shadow:0 0 12px #7fe3ff}
.a.on::after{content:"✔";position:absolute;right:2px;bottom:0;font-size:.6em;color:#7fe3ff}
.a.lk{opacity:.5}
#nm{margin-top:1vh;padding:.7vh 1vh;display:flex;justify-content:space-between;align-items:center}
#nm b{font-size:calc(var(--f)*1.3)}#nm small{opacity:.8;display:block}
#nm button{background:none;border:0;color:#fff;font-size:calc(var(--f)*1.2)}
#right{position:fixed;right:1.5vw;top:11vh;width:28vw;z-index:5;padding:1.2vh 1.2vw}
#right h2{font-size:calc(var(--f)*1.15);margin-bottom:.6vh}
#ct{opacity:.85;margin-bottom:1vh}
.st{display:grid;grid-template-columns:auto 1fr;gap:.5vh 1vw;align-items:center;margin-bottom:1vh}
.bar{height:.8vh;min-height:5px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fb7ff,#ff8fd0);transition:width .4s}
#th{display:flex;gap:.8vw}
.t{flex:1;aspect-ratio:1.5;border-radius:10px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:calc(var(--f)*1.3)}
.t.on{border-color:#7fe3ff;box-shadow:0 0 10px #7fe3ff}
#go{position:fixed;right:1.5vw;bottom:3vh;width:28vw;height:9vh;z-index:5;border:0;border-radius:14px;font-size:calc(var(--f)*1.7);font-weight:800;font-style:italic;
color:#4a2a00;background:linear-gradient(180deg,#ffe27a,#ffb02e);box-shadow:0 4px 18px #ffb02e88;border:2px solid #fff8}
#go:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);padding:.8em 1.4em;border-radius:99px;background:#1c1240ee;z-index:9;opacity:0;transition:.3s;pointer-events:none}
#toast.s{opacity:1}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#1c1240;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="top"><h1>🏁 Racing Setup</h1>
<div class="cur"><div class="glass">🪙 <span id="coin"></span></div><div class="glass">💎 120</div></div></div>

<div id="left" class="glass"><div id="av"></div>
<div id="nm" class="glass"><div><b id="pn">Lia</b><small>"Racing Dreamer"</small></div><button id="ed">✏️</button></div></div>

<div id="right" class="glass"><h2 id="cn"></h2><div id="ct"></div>
<div class="st" id="st"></div><div id="th"></div></div>

<button id="go"></button>
<div id="toast"></div>
<div id="rot">📱 Putar HP kamu ke mode landscape ya</div>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ====== DATA ====== */
const CARS=[
{n:'Scuderia Aurora',t:'Speed. Elegance. Victory.',color:0xd0142c,accent:0x16161f,s:[78,72,70,74],p:0},
{n:'Azure Phantom',t:'Precision in every corner.',color:0x1f5bff,accent:0xdfe8ff,s:[82,76,80,72],p:4000},
{n:'Violet Nova',t:'Burn bright, race brighter.',color:0x8a2be2,accent:0xffd1ff,s:[86,84,76,78],p:6000},
{n:'Silver Zenith',t:'Quiet power. Pure speed.',color:0xe4e7f2,accent:0x2a2f45,s:[92,88,85,86],p:8000}];
const AVS=['👩','👨','🧑‍🦰','🧑','👱','🧑‍🦱'];
const STAT=['Speed','Acceleration','Handling','Braking'];
let S={coins:12500,owned:[0],car:0,player:0,name:'Lia'};
try{Object.assign(S,JSON.parse(localStorage.getItem('apex_save')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('apex_save',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const hex=c=>'#'+c.toString(16).padStart(6,'0');

/* ====== THREE ====== */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(35,1,.1,200);

scene.add(new THREE.HemisphereLight(0xbfd8ff,0xff9ecf,.7));
const sun=new THREE.DirectionalLight(0xfff0e0,2.4);sun.position.set(5,9,4);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6});scene.add(sun);
const rim=new THREE.PointLight(0xff6fd0,80,0);rim.position.set(-5,2.5,-4);scene.add(rim);

/* lantai (pinggirnya memudar) */
const fc=document.createElement('canvas');fc.width=fc.height=256;
const fx=fc.getContext('2d'),fg=fx.createRadialGradient(128,128,40,128,128,128);
fg.addColorStop(0,'#fff');fg.addColorStop(1,'#000');fx.fillStyle=fg;fx.fillRect(0,0,256,256);
const floor=new THREE.Mesh(new THREE.CircleGeometry(30,64),
new THREE.MeshStandardMaterial({color:0x35286e,roughness:.18,metalness:.6,transparent:true,alphaMap:new THREE.CanvasTexture(fc)}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
[[3.6,.07,0xff5fc8],[5.2,.05,0x7fd8ff]].forEach(([r,w,c])=>{
const ring=new THREE.Mesh(new THREE.RingGeometry(r,r+w*3,64),new THREE.MeshBasicMaterial({color:c}));
ring.rotation.x=-Math.PI/2;ring.position.y=.01;scene.add(ring)});

/* kota & sakura di belakang */
const base=Math.atan2(-7.5,-6.5);
const rnd=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<16;i++){
const a=base+rnd(-1.3,1.3),r=rnd(19,28),h=rnd(4,15);
const b=new THREE.Mesh(new THREE.BoxGeometry(rnd(1.5,3),h,rnd(1.5,3)),
new THREE.MeshStandardMaterial({color:0xc4d8ff,emissive:0x3a5fc0,emissiveIntensity:.35,metalness:.6,roughness:.2}));
b.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);scene.add(b)}
const pinkM=new THREE.MeshStandardMaterial({color:0xff9fc6,emissive:0x4a1030,emissiveIntensity:.4,flatShading:true,roughness:.8});
const trunkM=new THREE.MeshStandardMaterial({color:0x5a3a3a,roughness:.9});
for(let i=0;i<9;i++){
const a=base+rnd(-1.15,1.15),r=rnd(10,17),s=rnd(.8,1.4),g=new THREE.Group();
const tr=new THREE.Mesh(new THREE.CylinderGeometry(.15*s,.25*s,2.2*s,6),trunkM);tr.position.y=1.1*s;g.add(tr);
for(let k=0;k<4;k++){const l=new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(.9,1.4)*s,1),pinkM);
l.position.set(rnd(-.9,.9)*s,rnd(2.3,3.4)*s,rnd(-.9,.9)*s);g.add(l)}
g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(g)}

/* kelopak sakura */
const pc=document.createElement('canvas');pc.width=pc.height=32;const px=pc.getContext('2d');
const pg=px.createRadialGradient(16,16,0,16,16,16);pg.addColorStop(0,'#fff');pg.addColorStop(1,'rgba(255,180,210,0)');
px.fillStyle=pg;px.fillRect(0,0,32,32);
const N=220,pp=new Float32Array(N*3),pv=[];
for(let i=0;i<N;i++){pp.set([rnd(-12,12),rnd(0,12),rnd(-12,12)],i*3);pv.push(rnd(.4,1))}
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffb7d5,size:.2,map:new THREE.CanvasTexture(pc),transparent:true,depthWrite:false})));

/* ====== MOBIL F1 (dibuat dari kode) ====== */
function buildCar(c){
const g=new THREE.Group();
const body=new THREE.MeshPhysicalMaterial({color:c.color,metalness:.5,roughness:.28,clearcoat:1,clearcoatRoughness:.1});
const dark=new THREE.MeshStandardMaterial({color:0x15151f,metalness:.4,roughness:.5});
const acc=new THREE.MeshStandardMaterial({color:c.accent,metalness:.4,roughness:.35});
const rub=new THREE.MeshStandardMaterial({color:0x101014,roughness:.85});
const rimM=new THREE.MeshStandardMaterial({color:0xcfd3e0,metalness:.9,roughness:.25});
const red=new THREE.MeshStandardMaterial({color:0xe3112b,roughness:.5});
const add=(geo,m,x,y,z,rx=0,ry=0,rz=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);g.add(o);return o};
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
add(B(.7,.4,2.2),body,0,.5,.1);                                   // bodi utama
add(new THREE.CylinderGeometry(.11,.3,1.7,16),body,0,.4,1.95,Math.PI/2); // hidung
for(const s of[-1,1]){add(B(.4,.32,1.3),body,s*.55,.4,-.05);      // sidepod
 add(B(.9,.04,.04),dark,s*.6,.3,1.8);add(B(.9,.04,.04),dark,s*.6,.35,-1.4)} // suspensi
add(B(.36,.4,1.1),body,0,.85,-.5);add(B(.3,.3,1.4),body,0,.6,-1.2);// airbox & engine cover
add(B(1.7,.05,3.2),dark,0,.17,.1);add(B(1,.08,.5),dark,0,.22,-1.65);// floor & diffuser
add(B(2.1,.05,.45),acc,0,.15,2.8);add(B(1.6,.04,.3),acc,0,.25,2.7);   // sayap depan
for(const s of[-1,1]){add(B(.05,.22,.5),acc,s*1.05,.25,2.8);add(B(.05,.55,.65),acc,s*.72,.95,-1.85)}
add(B(1.4,.05,.5),acc,0,1.05,-1.85);add(B(1.4,.04,.35),acc,0,1.2,-1.8);add(B(.08,.5,.12),dark,0,.75,-1.7);
add(new THREE.TorusGeometry(.3,.03,8,20,Math.PI),dark,0,.7,.45,0,Math.PI/2,0);  // halo
add(B(.04,.35,.04),dark,0,.85,.75);
add(new THREE.SphereGeometry(.15,16,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3}),0,.78,.3);
const wheel=(x,z,r,w)=>{const t=add(new THREE.CylinderGeometry(r,r,w,28),rub,x,r,z,0,0,Math.PI/2);
 add(new THREE.CylinderGeometry(r*.55,r*.55,w+.02,20),rimM,x,r,z,0,0,Math.PI/2);
 const sx=Math.sign(x);add(new THREE.CylinderGeometry(r+.005,r+.005,.04,28),red,x+sx*(w/2-.01),r,z,0,0,Math.PI/2)};
for(const s of[-1,1]){wheel(s*1.0,1.8,.36,.42);wheel(s*1.03,-1.4,.42,.55)}
g.traverse(o=>{if(o.isMesh)o.castShadow=true});
g.position.y=0;g.scale.setScalar(.01);
return g}

let car=null,tScale=0;
function showCar(){if(car)scene.remove(car);car=buildCar(CARS[S.car]);car.rotation.y=.6;scene.add(car);tScale=0}

/* putar mobil dengan geser jari */
let drag=false,lx=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(drag&&car){car.rotation.y+=(e.clientX-lx)*.012;lx=e.clientX}});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;
const k=w/h<1.7?1.25:1;camera.position.set(6.5*k,2.6*k,7.5*k);camera.lookAt(0,.55,0);camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
if(car){if(!drag)car.rotation.y+=dt*.45;tScale+=(1-tScale)*Math.min(1,dt*6);car.scale.setScalar(Math.max(.01,tScale))}
for(let i=0;i<N;i++){let y=pp[i*3+1]-pv[i]*dt;if(y<0)y=12;pp[i*3+1]=y;pp[i*3]+=Math.sin(t+i)*dt*.4}
pGeo.attributes.position.needsUpdate=true;
renderer.render(scene,camera)});

/* ====== UI ====== */
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),1800)}
function ui(){
$('coin').textContent=S.coins.toLocaleString('id-ID');$('pn').textContent=S.name;
$('av').innerHTML=AVS.map((a,i)=>`<div class="a ${i==S.player?'on':''}" data-i="${i}">${a}</div>`).join('')+'<div class="a lk">🔒</div>';
const c=CARS[S.car];$('cn').textContent=c.n;$('ct').textContent=c.t;
$('st').innerHTML=STAT.map((n,i)=>`<span>${n}</span><div class="bar"><i style="width:${c.s[i]}%"></i></div>`).join('');
$('th').innerHTML=CARS.map((k,i)=>`<div class="t ${i==S.car?'on':''}" data-i="${i}" style="background:linear-gradient(135deg,${hex(k.color)},#1a1240)">${S.owned.includes(i)?'🏎️':'🔒'}</div>`).join('');
const own=S.owned.includes(S.car);
$('go').textContent=own?'Start Race »':`Buka 🔒 ${c.p.toLocaleString('id-ID')}`}
$('av').onclick=e=>{const a=e.target.closest('.a');if(!a)return;if(a.classList.contains('lk'))return toast('Avatar ini masih terkunci');S.player=+a.dataset.i;save();ui()};
$('th').onclick=e=>{const t=e.target.closest('.t');if(!t)return;S.car=+t.dataset.i;save();ui();showCar()};
$('ed').onclick=()=>{const n=prompt('Nama pemain:',S.name);if(n&&n.trim()){S.name=n.trim().slice(0,12);save();ui()}};
$('go').onclick=()=>{
const c=CARS[S.car];
if(!S.owned.includes(S.car)){
 if(S.coins<c.p)return toast('Koin kamu belum cukup 🪙');
 S.coins-=c.p;S.owned.push(S.car);save();ui();return toast(c.n+' terbuka! 🎉')}
save();toast('Tersimpan! Fase 3 (Race Preparation) menyusul 🏁')};
ui();showCar();
</script>
</body>
</html>
